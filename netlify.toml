[build]
  command = "npm install && npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_VERSION = "18.20.7"
  NEXT_USE_NETLIFY_EDGE = "false"
  NPM_FLAGS = "--legacy-peer-deps"
  NEXT_PRIVATE_RUNTIME = "nodejs"
  NODE_ENV = "production"
  JWT_SECRET = "${JWT_SECRET}"

[functions]
  external_node_modules = ["@prisma/client", "jsonwebtoken", "bcryptjs"]
  included_files = ["prisma/**"]
  node_bundler = "esbuild"
  
[build.processing]
  skip_processing = false

[build.processing.js]
  bundle = false
  minify = false

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  framework = "next"
  targetPort = 3000